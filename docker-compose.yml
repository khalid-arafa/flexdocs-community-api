# FlexDocs (community, single-admin) — full stack: nginx + api + web + mongodb.
# Secrets are NOT stored here; they live in ./.env (generated by setup.sh,
# gitignored). Compose reads ./.env for ${MONGO_USER}/${MONGO_PASS} interpolation
# and injects it into the api container via env_file.
services:

  nginx:
    build:
      context: ./nginx
    container_name: flexdocs-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - flexdocs-net
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    restart: unless-stopped

  api:
    container_name: flexdocs-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ./.env
    networks:
      - flexdocs-net
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
    depends_on:
      mongodb:
        condition: service_started
    restart: unless-stopped

  web:
    container_name: flexdocs-web
    build:
      context: ./web
    env_file: ./web/.env
    networks:
      - flexdocs-net
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: flexdocs-mongodb
    volumes:
      - flexdocs-mongo-data:/data/db
    networks:
      - flexdocs-net
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-flexdocs_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    command: mongod --quiet --auth --bind_ip_all
    restart: unless-stopped

networks:
  flexdocs-net:
    driver: bridge

volumes:
  flexdocs-mongo-data:
