name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v5 runs on the runner's Node 24; v4 targeted Node 20, which GitHub
      # deprecated for actions. Unrelated to node-version below, which is the
      # Node the app is tested on.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx jest
