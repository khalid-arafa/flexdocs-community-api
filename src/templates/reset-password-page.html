<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Reset Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            background: white;
            max-width: 600px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            text-align: center;
            padding: 50px 40px;
            position: relative;
            overflow: hidden;
        }

        .header.success {
            background: linear-gradient(135deg, #28a745, #20c997);
        }

        .header.error {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="white" opacity="0.1"/></svg>') repeat;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-100px); }
        }

        .icon {
            background: rgba(255,255,255,0.2);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 40px;
            animation: bounceIn 0.8s ease-out;
            position: relative;
            z-index: 2;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
            position: relative;
            z-index: 2;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
            position: relative;
            z-index: 2;
        }

        .content {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .password-input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 15px 50px 15px 15px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input.error {
            border-color: #e74c3c;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            border-radius: 6px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .toggle-password:active {
            transform: translateY(-50%) scale(0.95);
        }

        .eye-icon {
            width: 20px;
            height: 20px;
            color: #6c757d;
            transition: all 0.3s ease;
        }

        .toggle-password:hover .eye-icon {
            color: #667eea;
        }

        .eye-icon.slash-animate {
            animation: slashIn 0.3s ease-out;
        }

        .eye-icon.open-animate {
            animation: openIn 0.3s ease-out;
        }

        @keyframes slashIn {
            0% { 
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            50% { 
                transform: scale(0.8) rotate(180deg);
                opacity: 0.5;
            }
            100% { 
                transform: scale(1) rotate(360deg);
                opacity: 1;
            }
        }

        @keyframes openIn {
            0% { 
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            50% { 
                transform: scale(1.2) rotate(180deg);
                opacity: 0.5;
            }
            100% { 
                transform: scale(1) rotate(360deg);
                opacity: 1;
            }
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover:not(:disabled) {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-message {
            text-align: center;
            margin-bottom: 30px;
        }

        .result-message h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .result-message p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        .footer {
            background: #f8f9fa;
            padding: 30px 40px;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }

        .copyright {
            color: #999;
            font-size: 12px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 12px;
            }

            .header {
                padding: 40px 30px;
            }

            .header h1 {
                font-size: 28px;
            }

            .content {
                padding: 30px 25px;
            }

            .footer {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header" id="header">
            <div class="icon" id="icon">
                🔐
            </div>
            <h1 id="title">Reset Password</h1>
            <p id="subtitle">of your {{projectName}} Account</p>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Form -->
            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="newPassword" name="newPassword" required>
                        <button type="button" id="togglePassword" class="toggle-password" aria-label="Toggle password visibility">
                            <svg class="eye-icon" id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <div class="spinner" id="spinner"></div>
                    <span id="btnText">Change</span>
                </button>
            </form>

            <!-- Result Message -->
            <div class="result-message hidden" id="resultMessage">
                <h2 id="resultTitle"></h2>
                <p id="resultText"></p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="copyright">
                © All rights reserved.
            </div>
        </div>
    </div>

    <script>
        let isPasswordChangeSuccessful = false;

        const form = document.getElementById('resetForm');
        const passwordInput = document.getElementById('newPassword');
        const passwordError = document.getElementById('passwordError');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        const header = document.getElementById('header');
        const icon = document.getElementById('icon');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');
        const resultMessage = document.getElementById('resultMessage');
        const resultTitle = document.getElementById('resultTitle');
        const resultText = document.getElementById('resultText');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        // Password visibility toggle functionality
        let isPasswordVisible = false;

        togglePassword.addEventListener('click', function() {
            isPasswordVisible = !isPasswordVisible;
            
            if (isPasswordVisible) {
                passwordInput.type = 'text';
                eyeIcon.classList.add('open-animate');
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.add('slash-animate');
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                `;
            }

            // Remove animation classes after animation completes
            setTimeout(() => {
                eyeIcon.classList.remove('open-animate', 'slash-animate');
            }, 300);
        });

        function validatePassword(password) {
            const hasMinLength = password.length >= 8;
            const hasUppercase = /[A-Z]/.test(password);
            const hasLowercase = /[a-z]/.test(password);
            const hasSymbol = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);

            if (!hasMinLength) {
                return 'Password must be at least 8 characters long';
            }
            if (!hasUppercase) {
                return 'Password must contain at least one uppercase letter';
            }
            if (!hasLowercase) {
                return 'Password must contain at least one lowercase letter';
            }
            if (!hasSymbol) {
                return 'Password must contain at least one symbol';
            }

            return '';
        }

        passwordInput.addEventListener('input', function() {
            const error = validatePassword(this.value);
            if (error) {
                this.classList.add('error');
                passwordError.textContent = error;
                passwordError.style.display = 'block';
            } else {
                this.classList.remove('error');
                passwordError.style.display = 'none';
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (isPasswordChangeSuccessful) {
                return;
            }

            const password = passwordInput.value;
            const error = validatePassword(password);

            if (error) {
                passwordInput.classList.add('error');
                passwordError.textContent = error;
                passwordError.style.display = 'block';
                return;
            }

            // Loading state
            submitBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = 'Changing...';

            try {
                const response = await fetch('{{formAction}}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ newPassword: password })
                });

                if (response.ok) {
                    // Success state
                    isPasswordChangeSuccessful = true;
                    header.classList.add('success');
                    header.classList.remove('error');
                    icon.textContent = '✅';
                    title.textContent = 'Password Updated!';
                    subtitle.textContent = 'Your password has been successfully changed';

                    form.classList.add('hidden');
                    resultMessage.classList.remove('hidden');
                    resultTitle.textContent = 'Success! 🎉';
                    resultText.textContent = 'Your password has been updated successfully. You can now use your new password to log in to your account.';

                } else {
                    throw new Error('Failed to update password');
                }

            } catch (error) {
                // Error state - allow retry
                header.className = 'header error'; // Reset classes and add error
                icon.textContent = '❌';
                title.textContent = 'Update Failed';
                subtitle.textContent = 'Something went wrong';

            } finally {
                // Reset button state only if not successful
                if (!isPasswordChangeSuccessful) {
                    submitBtn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.textContent = 'Change';
                }
            }
        });
    </script>
</body>
</html>
